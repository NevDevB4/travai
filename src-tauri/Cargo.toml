[package]
name = "travai"
version = "1.0.0"
description = "Travai - AI Code Assistant"
authors = ["Travai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.10", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["shell-open", "fs-all", "http-all", "global-shortcut", "system-tray", "clipboard-all"] }
tauri-plugin-http = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.51", features = ["Win32_Foundation", "Win32_System_Com"] }
clipboard-win = "5.0"

[[bin]]
name = "travai"
path = "src/main.rs"

[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static"]
